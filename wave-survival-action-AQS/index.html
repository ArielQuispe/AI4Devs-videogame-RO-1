<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Survival Action Game</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container text-center">
        <h1>Wave Survival Action Game</h1>
        <div id="menu">
            <button id="startGame" class="btn btn-primary">Iniciar un juego nuevo</button>
            <button id="viewScores" class="btn btn-secondary">Ver puntajes</button>
        </div>
        <div id="gameArea" class="d-none">
            <!-- Game area will be dynamically generated -->
        </div>
        <div id="scoreboard" class="d-none">
            <h2>Puntajes</h2>
            <ul id="scoreList"></ul>
            <button id="backToMenu" class="btn btn-secondary">Volver al inicio</button>
        </div>
    </div>
    <script src="actions.js"></script>
</body>
</html>
