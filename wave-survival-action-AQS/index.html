<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Survival Action</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Menú principal -->
    <div id="pantalla-menu" class="container text-center my-5">
        <h1>Wave Survival Action</h1>
        <button class="btn btn-primary my-2">Iniciar Juego Nuevo</button>
        <button class="btn btn-secondary my-2">Ver Puntajes</button>
    </div>

    <!-- Pantalla selección personaje -->
    <div id="pantalla-seleccion" class="container text-center my-5" style="display: none;">
        <h2>Selecciona tu personaje</h2>
        <div class="mb-3">
            <label for="selector-personaje" class="form-label">Personaje</label>
            <select id="selector-personaje" class="form-select">
                <option value="1">Personaje 1</option>
                <option value="2">Personaje 2</option>
                <option value="3">Personaje 3</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="nombre-jugador" class="form-label">Nombre</label>
            <input type="text" id="nombre-jugador" class="form-control" placeholder="Ingresa tu nombre">
        </div>
        <button class="btn btn-success">Iniciar Juego</button>
    </div>

    <!-- Pantalla juego -->
    <div id="pantalla-juego" class="container text-center my-5" style="display: none;">
        <h2>Juego en Progreso</h2>
        <div id="tablero" class="d-grid" style="grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(15, 1fr); gap: 5px;">
            <!-- Aquí se generarán las celdas del tablero dinámicamente -->
        </div>
        <div class="mt-3">
            <p>Salud: <span id="indicador-salud">100</span></p>
            <p>Puntaje: <span id="indicador-puntaje">0</span></p>
            <p>Oleada: <span id="indicador-oleada">1</span></p>
            <p>Poder: <span id="indicador-poder">1</span></p>
        </div>
    </div>

    <!-- Pantalla puntajes -->
    <div id="pantalla-puntajes" class="container text-center my-5" style="display: none;">
        <h2>Top 10 Puntajes</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Puntaje</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se llenarán los puntajes dinámicamente -->
            </tbody>
        </table>
        <button class="btn btn-secondary">Volver al Menú</button>
    </div>

    <!-- Pantalla Game Over -->
    <div id="pantalla-gameover" class="container text-center my-5" style="display: none;">
        <h2>¡Game Over!</h2>
        <p id="mensaje-ranking"></p>
        <button class="btn btn-primary" id="btn-volver-menu">Volver al Menú</button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="values.js"></script>
    <script src="actions.js"></script>
</body>
</html>
